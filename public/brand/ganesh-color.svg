<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="800" height="960" role="img" aria-label="Lord Ganesha">
  <defs>
    <radialGradient id="halo" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".45" stop-color="#ffd27a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe7a"/>
      <stop offset=".55" stop-color="#f6923f"/>
      <stop offset="1" stop-color="#e2702a"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb06a"/>
      <stop offset="1" stop-color="#e86f2c"/>
    </linearGradient>
    <linearGradient id="earIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd3b0"/>
      <stop offset="1" stop-color="#f7a07a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset=".45" stop-color="#f2c24b"/>
      <stop offset="1" stop-color="#b9761a"/>
    </linearGradient>
    <linearGradient id="lotus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1dc"/>
      <stop offset="1" stop-color="#e5638a"/>
    </linearGradient>
    <linearGradient id="tusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe1c6"/>
    </linearGradient>
  </defs>

  <!-- halo + rays -->
  <circle cx="200" cy="200" r="188" fill="url(#halo)"/>
  <g stroke="#f2b33d" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M200 6v26M200 368v26M6 200h26M368 200h26M63 63l18 18M319 319l18 18M337 63l-18 18M81 319l-18 18M126 20l7 24M274 20l-7 24M20 126l24 7M20 274l24-7M380 126l-24 7M380 274l-24-7"/>
  </g>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#f2b33d" stroke-width="1.4" stroke-dasharray="2 7" opacity=".8"/>

  <!-- Om -->
  <text x="200" y="24" text-anchor="middle" font-size="24" fill="#c0392b" font-family="Kohinoor Devanagari, Noto Serif Devanagari, serif">ॐ</text>

  <g stroke="#7a2e0e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <path d="M142 160 C 68 124, 30 210, 66 280 C 90 324, 140 316, 158 276 Z" fill="url(#ear)"/>
    <path d="M258 160 C 332 124, 370 210, 334 280 C 310 324, 260 316, 242 276 Z" fill="url(#ear)"/>
    <path d="M136 186 C 94 172, 74 224, 94 262 C 108 288, 132 286, 146 266 Z" fill="url(#earIn)" stroke-width="1.6"/>
    <path d="M264 186 C 306 172, 326 224, 306 262 C 292 288, 268 286, 254 266 Z" fill="url(#earIn)" stroke-width="1.6"/>
    <!-- ear ornaments -->
    <circle cx="96" cy="292" r="7" fill="url(#gold)" stroke-width="1.4"/>
    <circle cx="304" cy="292" r="7" fill="url(#gold)" stroke-width="1.4"/>

    <!-- head -->
    <path d="M138 150 C 132 200, 142 240, 170 266 C 184 276, 216 276, 230 266 C 258 240, 268 200, 262 150 Z" fill="url(#skin)"/>

    <!-- crown (mukut) -->
    <path d="M132 156 L 144 96 Q 168 112, 180 82 Q 200 40, 220 82 Q 232 112, 256 96 L 268 156 Z" fill="url(#gold)"/>
    <path d="M128 156 H 272 V 168 H 128 Z" fill="url(#gold)"/>
    <path d="M150 128 Q 200 112 250 128" fill="none" stroke-width="1.6"/>
    <circle cx="200" cy="116" r="11" fill="#d11a2a" stroke-width="2"/>
    <circle cx="200" cy="116" r="4" fill="#ffd6d6" stroke="none"/>
    <circle cx="162" cy="136" r="5.5" fill="#1f8a4c" stroke-width="1.4"/>
    <circle cx="238" cy="136" r="5.5" fill="#1f8a4c" stroke-width="1.4"/>
    <circle cx="200" cy="48" r="6" fill="url(#gold)" stroke-width="1.6"/>
    <g fill="#d11a2a" stroke-width="1.2">
      <circle cx="146" cy="162" r="3.2"/><circle cx="173" cy="162" r="3.2"/><circle cx="200" cy="162" r="3.2"/><circle cx="227" cy="162" r="3.2"/><circle cx="254" cy="162" r="3.2"/>
    </g>

    <!-- trunk -->
    <path d="M184 214 C 180 262, 174 312, 190 352 C 204 390, 252 400, 266 370 C 274 350, 250 336, 236 352 C 232 358, 238 364, 246 360 C 240 372, 220 368, 214 350 C 206 324, 214 270, 216 214 Z" fill="url(#skin)"/>
    <path d="M190 246 q12 6 24 0 M188 274 q13 6 26 0 M190 302 q11 6 22 0 M197 328 q9 5 18 -2" fill="none" stroke-width="1.6" opacity=".7"/>

    <!-- tusks -->
    <path d="M170 258 C 154 284, 154 304, 168 310 C 172 292, 178 278, 184 266 Z" fill="url(#tusk)" stroke-width="2"/>
    <path d="M230 258 C 242 270, 246 282, 242 290 C 236 284, 228 276, 220 266 Z" fill="url(#tusk)" stroke-width="2"/>

    <!-- eyes -->
    <path d="M158 206 Q 174 192 190 206 Q 174 216 158 206 Z" fill="#fff" stroke-width="2"/>
    <path d="M210 206 Q 226 192 242 206 Q 226 216 210 206 Z" fill="#fff" stroke-width="2"/>
    <path d="M154 190 Q 174 178 192 188 M208 188 Q 226 178 246 190" fill="none" stroke-width="2.4"/>
  </g>
  <circle cx="175" cy="205" r="5" fill="#2a160a"/>
  <circle cx="225" cy="205" r="5" fill="#2a160a"/>
  <circle cx="176.6" cy="203.4" r="1.4" fill="#fff"/>
  <circle cx="226.6" cy="203.4" r="1.4" fill="#fff"/>

  <!-- tilak -->
  <path d="M190 172 L200 192 L210 172" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="196" r="4.5" fill="#d11a2a"/>
  <path d="M180 180 h40" stroke="#fff6e0" stroke-width="2" stroke-linecap="round" opacity=".9"/>

  <!-- necklace -->
  <path d="M156 290 Q 200 326 244 290" fill="none" stroke="#b9761a" stroke-width="2"/>
  <g fill="url(#gold)" stroke="#8a5a12" stroke-width="1">
    <circle cx="160" cy="296" r="4"/><circle cx="172" cy="305" r="4"/><circle cx="185" cy="311" r="4"/><circle cx="215" cy="311" r="4"/><circle cx="228" cy="305" r="4"/><circle cx="240" cy="296" r="4"/>
  </g>

  <!-- lotus seat -->
  <g stroke="#a8335a" stroke-width="2" stroke-linejoin="round">
    <path d="M200 446 C 168 446, 130 432, 116 410 C 148 404, 182 420, 200 446 Z" fill="url(#lotus)"/>
    <path d="M200 446 C 232 446, 270 432, 284 410 C 252 404, 218 420, 200 446 Z" fill="url(#lotus)"/>
    <path d="M200 446 C 170 432, 156 410, 162 388 C 184 396, 198 420, 200 446 Z" fill="url(#lotus)"/>
    <path d="M200 446 C 230 432, 244 410, 238 388 C 216 396, 202 420, 200 446 Z" fill="url(#lotus)"/>
    <path d="M200 446 C 184 418, 184 396, 200 378 C 216 396, 216 418, 200 446 Z" fill="url(#lotus)"/>
  </g>
  <path d="M110 456 H290" stroke="#d99a2b" stroke-width="2" stroke-linecap="round"/>
</svg>
